version: "3.8"

services:
  backend:
    build: .
    container_name: tenderiq_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://tenderiq:tenderiq123@db:5432/tenderiq_db
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
      - redis
    volumes:
      - ./storage:/app/storage

  db:
    image: pgvector/pgvector:pg16
    container_name: tenderiq_postgres
    environment:
      - POSTGRES_USER=tenderiq
      - POSTGRES_PASSWORD=tenderiq123
      - POSTGRES_DB=tenderiq_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tenderiq_redis
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    container_name: tenderiq_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
